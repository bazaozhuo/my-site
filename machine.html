<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08100f">
  <meta name="description" content="A useless machine: a figure in a rowboat on a night lake. Click the water to row.">
  <title>The Machine — Chuai Zhuoyang</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- 先定主题再渲染：避免深色用户看到一瞬间白屏，也让浅色截图不会拍到过渡中的颜色 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t === null && !window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/nav.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/machine.js" defer></script>
</head>
<body class="um-body">
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <span id="top"></span>

  <header class="nav" id="siteNav"></header>

  <main id="main-content">
    <section class="um" aria-labelledby="pageTitle">
      <h1 id="pageTitle" class="visually-hidden">The Machine</h1>

      <div class="um__stage" id="umStage" tabindex="0"
           aria-label="Night lake. A figure sits in a rowboat. Click the water, or use the arrow keys, to row.">

        <svg class="um__scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#07100f"/>
              <stop offset="100%" stop-color="#123039"/>
            </linearGradient>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0e2027"/>
              <stop offset="100%" stop-color="#050c0f"/>
            </linearGradient>
            <clipPath id="lakeClip"><rect x="0" y="350" width="1200" height="350"/></clipPath>
            <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="14"/>
            </filter>
            <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="10"/>
            </filter>
            <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e9e3d1" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="#e9e3d1" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="moonPath" cx="50%" cy="18%" r="72%">
              <stop offset="0%"   stop-color="#e9e3d1" stop-opacity="0.30"/>
              <stop offset="45%"  stop-color="#e9e3d1" stop-opacity="0.10"/>
              <stop offset="100%" stop-color="#e9e3d1" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- sky -->
          <rect width="1200" height="700" fill="url(#sky)"/>

          <!-- moon: one circle, one halo -->
          <circle cx="880" cy="140" r="86" fill="#e9e3d1" opacity="0.06"/>
          <circle cx="880" cy="140" r="40" fill="#e9e3d1" opacity="0.9"/>

          <!-- treeline: two flat silhouettes -->
          <path class="um-trees-far" fill="#0e2226" opacity="0.95"
                d="M0 330 L120 292 L240 322 L360 288 L480 326 L600 290 L720 324 L840 288 L960 322 L1080 292 L1200 326 L1200 360 L0 360 Z"/>
          <path class="um-trees-near" fill="#06100f"
                d="M0 352 L140 322 L280 350 L420 320 L560 352 L700 322 L840 350 L980 320 L1120 352 L1200 330 L1200 372 L0 372 Z"/>

          <!-- water -->
          <rect y="350" width="1200" height="350" fill="url(#water)"/>
          <g class="um-reflect" clip-path="url(#lakeClip)">
            <ellipse cx="880" cy="470" rx="66" ry="140" fill="url(#moonPath)"/>
            <g stroke="#e9e3d1" stroke-linecap="round" opacity="0.13">
              <path d="M846 400 h68" stroke-width="2"/>
              <path d="M858 430 h44" stroke-width="1.4"/>
              <path d="M838 462 h84" stroke-width="1.4"/>
              <path d="M852 496 h56" stroke-width="1.2"/>
            </g>
          </g>
          <rect y="350" width="1200" height="2" fill="#1b3d46" opacity="0.8"/>

          <g id="umRipples"></g>

          <!-- three still lines on the water -->
          <g stroke="#8fb6ba" stroke-linecap="round" opacity="0.08">
            <path d="M120 420 h180" stroke-width="2"/>
            <path d="M700 470 h240" stroke-width="2"/>
            <path d="M300 540 h160" stroke-width="2"/>
          </g>

          <!-- boat + figure: simple shapes only -->
          <g class="um-boat" id="umBoat" transform="translate(430 468)">
            <ellipse cx="0" cy="30" rx="74" ry="6" fill="#000" opacity="0.28"/>

            <g class="um-oar um-oar--l">
              <line x1="-44" y1="-2" x2="-112" y2="38" stroke="#43301f" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g class="um-oar um-oar--r">
              <line x1="44" y1="-2" x2="112" y2="38" stroke="#43301f" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- lantern on the bow -->
            <g class="um-lamp">
              <circle cx="56" cy="-2" r="18" fill="#ffb765" opacity="0.13"/>
              <circle cx="56" cy="-2" r="9" fill="#ffc98a" opacity="0.22"/>
              <circle cx="56" cy="-2" r="3.1" fill="#ffe6c0"/>
              <path d="M56 -6 v-5" stroke="#2a1d15" stroke-width="2" stroke-linecap="round"/>
            </g>

            <!-- hull: one crescent -->
            <path d="M-72 0 C -50 26 -24 32 0 32 C 24 32 50 26 72 0 Z" fill="#2a1c12"/>
            <path d="M-72 0 C -50 26 -24 32 0 32 C 24 32 50 26 72 0" fill="none" stroke="#5c4029" stroke-width="2"/>
            <path d="M-66 -1 C -48 20 -26 27 0 27 C 26 27 48 20 66 -1" fill="none" stroke="#7a5735" stroke-width="1.2" opacity="0.5"/>

            <!-- figure: body, head, hat -->
            <path d="M-15 0 C -17 -34 -8 -44 2 -44 C 12 -44 19 -34 17 0 Z" fill="#14171b"/>
            <circle cx="2" cy="-54" r="11" fill="#c8b8a1"/>
            <path d="M-16 -58 H 20" stroke="#0f1216" stroke-width="4" stroke-linecap="round"/>
            <path d="M-10 -58 C -10 -66 14 -66 14 -58 Z" fill="#0f1216"/>
          </g>

          <!-- something under the water (moves with JS) -->
          <g id="umUnder" opacity="0" filter="url(#blur8)">
            <ellipse cx="0" cy="0" rx="92" ry="17" fill="#03161a"/>
            <ellipse cx="-18" cy="2" rx="52" ry="9" fill="#020f12" opacity="0.7"/>
          </g>

          <!-- fog drifting across the lake -->
          <g class="um-fog" aria-hidden="true" filter="url(#blurSoft)">
            <ellipse class="um-fog__a" cx="240" cy="470" rx="420" ry="46" fill="#9fc3c6" opacity="0.035"/>
            <ellipse class="um-fog__b" cx="900" cy="530" rx="520" ry="54" fill="#9fc3c6" opacity="0.03"/>
            <ellipse class="um-fog__c" cx="560" cy="610" rx="480" ry="60" fill="#9fc3c6" opacity="0.028"/>
          </g>
        </svg>

        <p class="um__caption" id="umCaption"><span>Click the water</span> to row</p>
        <p class="um__meter"><span id="umDist">0</span> m</p>

        <button type="button" class="um__sound" id="umSound" aria-pressed="true" aria-label="Mute the lake">
          <svg class="um__sound-on" viewBox="0 0 24 24" width="17" height="17" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h3.2L13 19V5L7.2 9H4Z"/>
            <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          </svg>
          <svg class="um__sound-off" viewBox="0 0 24 24" width="17" height="17" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h3.2L13 19V5L7.2 9H4Z"/>
            <path d="m16 9 5 6m0-6-5 6"/>
          </svg>
        </button>
        <p class="um__sr" id="umStatus" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
</body>
</html>
