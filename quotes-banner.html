<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1421">
  <meta name="description" content="One quote at a time, shown full screen. Click the author to read everything they said.">
  <title>Words worth remembering — Chuai Zhuoyang</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/nav.js" defer></script>
  <script src="js/quotes-data.js" defer></script>
  <script src="js/quotes.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body class="banner-body">
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  <a class="skip-link" href="#quoteStage">Skip to the quote</a>
  <span id="top"></span>

  <header class="nav" id="siteNav"></header>

  <main id="main-content">
    <section class="stage" id="quoteStage" aria-label="Quote banner">

      <p class="stage__eyebrow">
        <a href="quotes.html" class="stage__back"><span aria-hidden="true">←</span> Words that move you</a>
        <span class="stage__index" id="qIndex"></span>
      </p>

      <figure class="stage__figure">
        <blockquote class="stage__text" id="qText"></blockquote>
        <p class="stage__zh" id="qZh" lang="zh-CN"></p>
        <figcaption class="stage__author">
          <a class="stage__author-link" id="qAuthor" href="#"></a>
          <span class="stage__tag" id="qTag"></span>
        </figcaption>
      </figure>

      <div class="stage__controls">
        <button type="button" class="stage__btn" id="qPrev" aria-label="Previous quote">‹</button>
        <button type="button" class="stage__btn stage__btn--main" id="qShuffle">
          <span aria-hidden="true">↻</span> Another one
        </button>
        <button type="button" class="stage__btn" id="qNext" aria-label="Next quote">›</button>
      </div>

      <p class="stage__hint">
        <kbd>←</kbd><kbd>→</kbd> to move · click the name to read everything they said
        · <a href="quotes-all.html">see all 15</a>
      </p>

    </section>
  </main>
</body>
</html>
